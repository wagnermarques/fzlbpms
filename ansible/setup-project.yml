---
# =============================================================================
# setup-project.yml — Full system onboarding and setup for fzlbpms
#
# Configures everything needed on the host machine to run the project smoothly:
#   1. Installs Docker Engine + Docker Compose v2 plugin (Debian, Ubuntu, Fedora, Alpine).
#   2. Configures Docker storage driver (btrfs optimization on Fedora Workstation).
#   3. Sets SELinux container_file_t contexts on bind-mounted directories.
#   4. Configures /etc/hosts (maps 127.0.0.1 fzlbpms.local for browser access).
#   5. Installs mkcert, trusts the local CA, and stages HTTPS certs for containers.
#
# Usage:
#   cd ansible
#   ansible-playbook setup-project.yml -K        # -K prompts for sudo password
#
# After the first run:
#   - Open a new terminal (or run `newgrp docker`) for group permissions.
#   - Start the stack: ./bin/run-stack.sh basic
# =============================================================================
- name: Setup host environment for fzlbpms stack
  hosts: docker_hosts
  become: false
  vars:
    docker_login_user: "{{ ansible_env.SUDO_USER | default(ansible_env.USER) }}"
    fzlbpms_repo_root: "{{ (playbook_dir + '/..') | realpath }}"

    docker_packages:
      Debian:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      RedHat:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      Alpine:
        - docker
        - docker-cli-compose

  pre_tasks:
    - name: Ensure the distribution is supported
      ansible.builtin.assert:
        that: ansible_facts.os_family in docker_packages
        fail_msg: >-
          Unsupported OS family '{{ ansible_facts.os_family }}'.
          This playbook supports Debian, Ubuntu, Fedora and Alpine.

    - name: Ensure this playbook only targets Fedora within the RedHat family
      ansible.builtin.assert:
        that: ansible_facts.distribution == "Fedora"
        fail_msg: >-
          '{{ ansible_facts.distribution }}' uses a different Docker repo path
          than Fedora (see download.docker.com/linux/) — add it explicitly
          before running this playbook on RHEL/CentOS/Rocky.
      when: ansible_facts.os_family == "RedHat"

  tasks:
    # ------------------------------------------------------------------
    # 1. Docker Engine Installation (Debian / Ubuntu)
    # ------------------------------------------------------------------
    - name: Install apt prerequisites for Docker
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Create the apt keyrings directory
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts.os_family == "Debian"

    - name: Download Docker's apt GPG key
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_facts.os_family == "Debian"

    - name: Add Docker apt repository
      become: true
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ ansible_facts.architecture | regex_replace('x86_64', 'amd64') | regex_replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
          {{ ansible_facts.distribution_release }} stable
        filename: docker
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Debian"

    - name: Install Docker Engine (apt)
      become: true
      ansible.builtin.apt:
        name: "{{ docker_packages.Debian }}"
        state: present
      when: ansible_facts.os_family == "Debian"

    # ------------------------------------------------------------------
    # 2. Docker Engine Installation (Fedora)
    # ------------------------------------------------------------------
    - name: Install dnf-plugins-core
      become: true
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Add Docker dnf repository
      become: true
      ansible.builtin.yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/fedora/gpg
        enabled: true
      when: ansible_facts.os_family == "RedHat"

    - name: Install Docker Engine (dnf)
      become: true
      ansible.builtin.dnf:
        name: "{{ docker_packages.RedHat }}"
        state: present
      when: ansible_facts.os_family == "RedHat"

    # ------------------------------------------------------------------
    # 3. Docker Engine Installation (Alpine)
    # ------------------------------------------------------------------
    - name: Install Docker (apk)
      become: true
      community.general.apk:
        name: "{{ docker_packages.Alpine }}"
        state: present
        update_cache: true
      when: ansible_facts.os_family == "Alpine"

    # ------------------------------------------------------------------
    # 4. Service & Group Configuration
    # ------------------------------------------------------------------
    - name: Enable and start docker service (systemd)
      become: true
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      when: ansible_facts.os_family in ["Debian", "RedHat"]

    - name: Enable and start docker service (OpenRC)
      become: true
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      when: ansible_facts.os_family == "Alpine"

    - name: Add {{ docker_login_user }} to docker group
      become: true
      ansible.builtin.user:
        name: "{{ docker_login_user }}"
        groups: docker
        append: true

    # ------------------------------------------------------------------
    # 5. btrfs Storage Driver Optimization (Fedora Workstation)
    # ------------------------------------------------------------------
    - name: Detect filesystem backing docker data-root
      ansible.builtin.command: stat -f -c %T /var/lib/docker
      register: docker_root_fstype
      changed_when: false
      when: ansible_facts.os_family in ["Debian", "RedHat"]

    - name: Ensure /etc/docker exists
      become: true
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"
      when:
        - ansible_facts.os_family in ["Debian", "RedHat"]
        - docker_root_fstype.stdout | default('') == "btrfs"

    - name: Configure native btrfs storage driver
      become: true
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "storage-driver": "btrfs",
            "features": {
              "containerd-snapshotter": false
            }
          }
      register: docker_daemon_json
      when:
        - ansible_facts.os_family in ["Debian", "RedHat"]
        - docker_root_fstype.stdout | default('') == "btrfs"

    - name: Restart docker to apply storage-driver change
      become: true
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: docker_daemon_json is changed

    # ------------------------------------------------------------------
    # 6. SELinux: Container file labels
    # ------------------------------------------------------------------
    - name: Ensure semanage is available (policycoreutils-python-utils)
      become: true
      ansible.builtin.dnf:
        name: policycoreutils-python-utils
        state: present
      when:
        - ansible_facts.os_family == "RedHat"
        - ansible_facts.selinux.status | default('disabled') == "enabled"

    - name: Persist container_file_t SELinux context for bind-mounts
      become: true
      community.general.sefcontext:
        target: "{{ fzlbpms_repo_root }}/{{ item }}(/.*)?"
        setype: container_file_t
        state: present
      loop:
        - containers
        - src-projects
      when: ansible_facts.selinux.status | default('disabled') == "enabled"

    - name: Apply container_file_t context to existing files
      become: true
      ansible.builtin.command: "restorecon -Rv {{ fzlbpms_repo_root }}/{{ item }}"
      loop:
        - containers
        - src-projects
      register: restorecon_result
      changed_when: restorecon_result.stdout != ""
      when: ansible_facts.selinux.status | default('disabled') == "enabled"

    # ------------------------------------------------------------------
    # 7. DNS & Host Resolution (/etc/hosts)
    # ------------------------------------------------------------------
    - name: Map fzlbpms.local to 127.0.0.1 in /etc/hosts
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 fzlbpms.local"
        regexp: '^127\.0\.0\.1\s+.*fzlbpms\.local.*$'
        state: present

    # ------------------------------------------------------------------
    # 8. Local HTTPS & SSL Certificates (mkcert)
    # ------------------------------------------------------------------
    - name: Install mkcert and nss-tools (Fedora)
      become: true
      ansible.builtin.dnf:
        name:
          - mkcert
          - nss-tools
        state: present
      when: ansible_facts.os_family == "RedHat"

    - name: Install mkcert and libnss3-tools (Debian/Ubuntu)
      become: true
      ansible.builtin.apt:
        name:
          - mkcert
          - libnss3-tools
        state: present
      when: ansible_facts.os_family == "Debian"

    - name: Trust mkcert CA in user's browser/NSS store
      become: false
      ansible.builtin.command: mkcert -install
      environment:
        TRUST_STORES: nss
      register: mkcert_nss
      changed_when: (mkcert_nss.stdout + mkcert_nss.stderr) is search('now installed')
      when: ansible_facts.os_family in ["Debian", "RedHat"]

    - name: Locate mkcert CA root directory
      become: false
      ansible.builtin.command: mkcert -CAROOT
      register: mkcert_caroot
      changed_when: false
      when: ansible_facts.os_family in ["Debian", "RedHat"]

    - name: Trust mkcert CA in system trust store (Fedora)
      become: true
      ansible.builtin.copy:
        src: "{{ mkcert_caroot.stdout | trim }}/rootCA.pem"
        dest: /etc/pki/ca-trust/source/anchors/mkcert-{{ docker_login_user }}-rootCA.pem
        remote_src: true
        mode: "0644"
      register: mkcert_system_anchor_fedora
      when: ansible_facts.os_family == "RedHat"

    - name: Update system CA trust bundle (Fedora)
      become: true
      ansible.builtin.command: update-ca-trust
      when:
        - ansible_facts.os_family == "RedHat"
        - mkcert_system_anchor_fedora is changed

    - name: Trust mkcert CA in system trust store (Debian/Ubuntu)
      become: true
      ansible.builtin.copy:
        src: "{{ mkcert_caroot.stdout | trim }}/rootCA.pem"
        dest: /usr/local/share/ca-certificates/mkcert-{{ docker_login_user }}-rootCA.crt
        remote_src: true
        mode: "0644"
      register: mkcert_system_anchor_debian
      when: ansible_facts.os_family == "Debian"

    - name: Update system CA certificates (Debian/Ubuntu)
      become: true
      ansible.builtin.command: update-ca-certificates
      when:
        - ansible_facts.os_family == "Debian"
        - mkcert_system_anchor_debian is changed

    - name: Generate and stage fzlbpms.local certificates across container dirs
      become: false
      ansible.builtin.command: ./bin/setup-local-https.sh
      args:
        chdir: "{{ fzlbpms_repo_root }}"
      register: local_https_setup
      changed_when: "'Done.' in local_https_setup.stdout"
      when: ansible_facts.os_family in ["Debian", "RedHat"]

    - name: Show setup-local-https.sh output
      ansible.builtin.debug:
        msg: "{{ local_https_setup.stdout_lines }}"
      when:
        - local_https_setup is defined
        - local_https_setup.stdout_lines is defined

    # ------------------------------------------------------------------
    # 9. Verification & Summary
    # ------------------------------------------------------------------
    - name: Verify Docker tools are accessible
      ansible.builtin.command: "{{ item }}"
      loop:
        - docker --version
        - docker compose version
      register: versions
      changed_when: false
      become: true

    - name: Display installed versions
      ansible.builtin.debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"

    - name: Summary notice
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "Setup Complete!"
          - "  - Docker & Compose v2: Installed and running"
          - "  - /etc/hosts: 127.0.0.1 fzlbpms.local configured"
          - "  - SSL Certs: mkcert trusted on host and staged for containers"
          - "=================================================================="
          - "Next steps:"
          - "  1. If running for the first time, refresh group: `newgrp docker`"
          - "  2. Start the stack: `./bin/run-stack.sh basic`"
          - "  3. Open: `https://fzlbpms.local/fzlbpmsadmin/`"
          - "=================================================================="
