# The modeler's own assets (modeler.html, index.html, js/*.js, css/*.css) have
# NO content hash in their names — unlike the Angular app's main-<hash>.js — so
# a browser that cached storage.js will keep using it after a rebuild and call
# endpoints that no longer exist. That happened on 2026-10-15: the picker kept
# requesting the pre-refactor /api/bpmndrawer/orbeon-forms and showed a 404.
#
# "no-cache" does not mean "don't store": it means revalidate before reuse, so
# unchanged files still answer 304 and cost almost nothing. The bpmn-js bundle
# below IS versioned by its pinned release, so it keeps a long cache.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Vendored bpmn-js assets: pinned to a release in the Dockerfile, so their
    # content only changes when that pin changes — safe to cache hard.
    location ~* ^/(js/bpmn-modeler\.production\.min\.js|css/(diagram-js|bpmn-js)\.css|css/bpmn-font/) {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
}
