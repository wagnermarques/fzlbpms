<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FzlBPMS — Modelador BPMN</title>
  <link rel="stylesheet" href="css/diagram-js.css">
  <link rel="stylesheet" href="css/bpmn-js.css">
  <link rel="stylesheet" href="css/bpmn-font/css/bpmn-embedded.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/bpmn-modeler.production.min.js"></script>
</head>
<body class="modelador">
<header class="top">
  <a class="brand" href="./">← Início</a>
  <input type="text" id="nome" placeholder="Nome do diagrama" aria-label="Nome do diagrama">
  <span id="dirty" class="badge" hidden>não salvo</span>
  <span class="spacer"></span>
  <button id="btnXml" title="Baixar arquivo XML do BPMN">Baixar XML</button>
  <button id="btnSvg" title="Baixar arquivo vetorial SVG">Baixar SVG</button>
  <button id="btnPng" title="PNG do diagrama inteiro, com imagens de documentação">Baixar imagem</button>
  <button class="primary" id="btnSalvar">Salvar</button>
</header>

<div class="editor">
  <div id="canvas"></div>
  <aside id="painel"></aside>
</div>

<script src="js/storage.js"></script>
<script src="js/flowable-moddle.js"></script>
<script src="js/imagens.js"></script>
<script>
let id = new URLSearchParams(location.search).get('id');
const modeler = new BpmnJS({
  container: '#canvas',
  keyboard: { bindTo: document },
  moddleExtensions: { flowable: FLOWABLE_MODDLE, integra: INTEGRA_MODDLE },
});
const modeling = modeler.get('modeling');
const moddle = modeler.get('moddle');
const canvas = modeler.get('canvas');

let dirty = false;
let selected = null;

function setDirty(v) {
  dirty = v;
  const el = document.getElementById('dirty');
  if (el) el.hidden = !v;
}

// ---------- Painel de propriedades Flowable ----------
const FIELDS = {
  'bpmn:Process': [
    ['id', 'Chave do processo', 'Identificador usado para iniciar o processo.'],
    ['name', 'Nome'],
  ],
  'bpmn:StartEvent': [
    ['name', 'Nome'],
    ['flowable:initiator', 'Variável do iniciador', 'Ex.: initiator → ${initiator}'],
    ['flowable:formKey', 'Form key'],
  ],
  'bpmn:UserTask': [
    ['name', 'Nome'],
    ['flowable:assignee', 'Responsável', 'Usuário fixo ou expressão, ex.: ${initiator}'],
    ['flowable:candidateUsers', 'Usuários candidatos', 'Separados por vírgula'],
    ['flowable:candidateGroups', 'Grupos candidatos', 'Ex.: admin,gerentes'],
    ['flowable:formKey', 'Form key', 'Identificador de formulário'],
    ['flowable:dueDate', 'Prazo', 'Data ISO ou expressão, ex.: P3D'],
  ],
  'bpmn:ServiceTask': [
    ['name', 'Nome'],
    ['flowable:type', 'Tipo', 'Vazio = Java; "http", "mail", "shell"...'],
    ['flowable:expression', 'Expressão', 'Ex.: ${execution.setVariable("ok", true)}'],
    ['flowable:delegateExpression', 'Delegate expression', 'Bean Spring / Camel'],
    ['flowable:class', 'Classe Java'],
    ['flowable:resultVariableName', 'Variável de resultado'],
  ],
  'bpmn:SequenceFlow': [
    ['name', 'Nome'],
    ['$condition', 'Condição', 'Expressão UEL, ex.: ${aprovado == true}.'],
  ],
};
FIELDS['bpmn:SendTask'] = FIELDS['bpmn:ServiceTask'];

function rootProcess() {
  const root = canvas.getRootElement();
  const bo = root && root.businessObject;
  return bo && bo.$instanceOf('bpmn:Process') ? root : null;
}

function readField(bo, key) {
  if (key === '$condition') return bo.conditionExpression ? bo.conditionExpression.body || '' : '';
  return bo.get(key) ?? '';
}

function writeField(element, key, value) {
  const v = value === '' ? undefined : value;
  if (key === '$condition') {
    modeling.updateProperties(element, {
      conditionExpression: v === undefined ? undefined : moddle.create('bpmn:FormalExpression', { body: v }),
    });
  } else if (key === 'id' && !v) {
    toast('O id não pode ficar vazio.', 'error');
  } else {
    modeling.updateProperties(element, { [key]: v });
  }
}

function renderPanel() {
  const panel = document.getElementById('painel');
  const element = selected || rootProcess();
  if (!element) {
    panel.innerHTML = !canvas.getRootElement() ? '' : '<h3>Colaboração</h3><p class="hint">Selecione um elemento para configurar suas propriedades.</p>';
    return;
  }
  const bo = element.businessObject;
  const type = Object.keys(FIELDS).find(t => bo.$type === t);
  let html = `<h3>${esc(bo.$type.replace('bpmn:', ''))}</h3><div class="hint mono">${esc(bo.id)}</div>`;

  if (bo.$type === 'bpmn:Process') {
    html += `<label><input type="checkbox" id="fExec" ${bo.isExecutable ? 'checked' : ''}> Executável</label>
             <div class="hint">O Flowable ignora processos não executáveis ao implantar.</div>`;
  }
  if (!type) {
    html += `<label>Nome</label><input type="text" data-key="name" value="${esc(bo.name || '')}">
             <p class="hint">Sem propriedades específicas para este tipo no painel. Atributos adicionados no XML são preservados.</p>`;
  } else {
    for (const [key, label, hint] of FIELDS[type]) {
      const val = readField(bo, key);
      const input = key === '$condition' || key === 'flowable:expression'
        ? `<textarea data-key="${key}">${esc(val)}</textarea>`
        : `<input type="text" data-key="${key}" value="${esc(val)}">`;
      html += `<label>${esc(label)}</label>${input}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}`;
    }
  }
  const podeTerImagem = selected && !selected.waypoints;
  if (podeTerImagem) html += painelImagemHtml(bo);
  panel.innerHTML = html;
  if (podeTerImagem) ligarPainelImagem(panel, element);

  panel.querySelectorAll('[data-key]').forEach(inp => {
    inp.addEventListener('change', () => writeField(element, inp.dataset.key, inp.value.trim()));
  });
  const exec = panel.querySelector('#fExec');
  if (exec) exec.addEventListener('change', () => modeling.updateProperties(element, { isExecutable: exec.checked }));
}

// ---------- Imagem de documentação ----------
function painelImagemHtml(bo) {
  const imagemData = bo.get('integra:imagem');
  const largura = bo.get('integra:imagemLargura') || Imagens.LARGURA_PADRAO;
  return `<h3 style="margin-top:20px">Imagem de documentação</h3>
    ${imagemData
      ? `<a href="${esc(imagemData)}" target="_blank" rel="noopener" title="Abrir em tamanho real"><img class="painel-imagem" src="${esc(imagemData)}" alt=""></a>
         <label>Largura no diagrama (px)</label>
         <input type="number" min="40" max="2000" step="10" id="fImgLargura" value="${largura}">
         <div class="linha-botoes"><button id="btnImgTrocar">Trocar</button><button class="danger" id="btnImgRemover">Remover</button></div>`
      : `<button id="btnImgTrocar">Adicionar imagem…</button>`}
    <div class="hint">Dica: com o elemento selecionado, cole um print com Ctrl+V.</div>
    <input type="file" id="fImg" accept="image/png,image/jpeg,image/gif,image/webp" hidden>`;
}

function ligarPainelImagem(panel, element) {
  const file = panel.querySelector('#fImg');
  panel.querySelector('#btnImgTrocar').onclick = () => file.click();
  file.onchange = async () => {
    if (file.files[0]) {
      const dataUri = await Imagens.readFileAsDataURL(file.files[0]);
      modeling.updateProperties(element, { 'integra:imagem': dataUri });
      Imagens.desenhar(modeler);
      renderPanel();
    }
  };
  const remover = panel.querySelector('#btnImgRemover');
  if (remover) remover.onclick = () => {
    modeling.updateProperties(element, { 'integra:imagem': undefined, 'integra:imagemLargura': undefined });
    Imagens.desenhar(modeler);
    renderPanel();
  };
  const largura = panel.querySelector('#fImgLargura');
  if (largura) largura.onchange = () => {
    const v = parseInt(largura.value, 10);
    modeling.updateProperties(element, { 'integra:imagemLargura': Number.isFinite(v) && v > 0 ? v : undefined });
    Imagens.desenhar(modeler);
  };
}

document.addEventListener('paste', async (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  if (!selected || selected.waypoints) {
    toast('Selecione um elemento antes de colar a imagem.', 'error');
    return;
  }
  const dataUri = await Imagens.readFileAsDataURL(item.getAsFile());
  modeling.updateProperties(selected, { 'integra:imagem': dataUri });
  Imagens.desenhar(modeler);
  renderPanel();
  toast('Imagem anexada.', 'ok');
});

modeler.on('selection.changed', (e) => {
  selected = e.newSelection.length === 1 ? e.newSelection[0] : null;
  renderPanel();
});
modeler.on('commandStack.changed', () => { setDirty(true); renderPanel(); Imagens.desenhar(modeler); });
modeler.on('import.done', () => Imagens.desenhar(modeler));

// ---------- Persistência ----------
async function load() {
  if (!id) {
    const name = 'Novo Processo';
    document.getElementById('nome').value = name;
    await modeler.importXML(newDiagramXml(name));
    canvas.zoom('fit-viewport', 'auto');
    setDirty(false);
    renderPanel();
    return;
  }
  const d = Storage.get(id);
  if (!d) {
    toast('Diagrama não encontrado.', 'error');
    setTimeout(() => { location.href = './'; }, 1500);
    return;
  }
  document.getElementById('nome').value = d.name;
  document.title = `${d.name} — Modelador BPMN`;
  try {
    const { warnings } = await modeler.importXML(d.xml);
    if (warnings.length) console.warn('Avisos de importação', warnings);
    canvas.zoom('fit-viewport', 'auto');
    setDirty(false);
    renderPanel();
  } catch (e) {
    toast('Falha ao abrir XML: ' + e.message, 'error');
  }
}

async function save() {
  const name = document.getElementById('nome').value.trim();
  if (!name) { toast('Informe o nome do diagrama.', 'error'); return false; }
  const { xml } = await modeler.saveXML({ format: true });
  const root = rootProcess();
  const processKey = root ? root.businessObject.id : null;
  const saved = Storage.save({ id, name, xml, processKey });
  id = saved.id;
  // Atualiza URL sem recarregar
  const newUrl = `${location.pathname}?id=${encodeURIComponent(id)}`;
  window.history.replaceState({ path: newUrl }, '', newUrl);
  setDirty(false);
  return true;
}

function download(filename, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function fileBase() {
  return (document.getElementById('nome').value.trim() || 'diagrama').replace(/[^\w.-]+/g, '_');
}

document.getElementById('nome').addEventListener('input', () => setDirty(true));

document.getElementById('btnSalvar').onclick = async () => {
  try { if (await save()) toast('Salvo no navegador.', 'ok'); } catch (e) { toast(e.message, 'error'); }
};

document.getElementById('btnXml').onclick = async () => {
  const { xml } = await modeler.saveXML({ format: true });
  download(fileBase() + '.bpmn20.xml', xml, 'application/xml');
};

document.getElementById('btnSvg').onclick = async () => {
  try {
    const { svg } = await Imagens.svgComImagens(modeler);
    download(fileBase() + '.svg', svg, 'image/svg+xml');
  } catch (e) { toast('Falha ao gerar SVG: ' + e.message, 'error'); }
};

document.getElementById('btnPng').onclick = async (ev) => {
  const btn = ev.currentTarget;
  btn.disabled = true;
  try {
    const png = await Imagens.png(modeler);
    download(fileBase() + '.png', png, 'image/png');
  } catch (e) {
    toast('Falha ao gerar imagem: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
};

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    document.getElementById('btnSalvar').click();
  }
});

window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

load();
</script>
</body>
</html>
