# nginx only ever sees plain http ($scheme), but tunnel traffic was https at
# Cloudflare's edge, which records that in X-Forwarded-Proto. Preserve it when
# present so Keycloak (KC_PROXY_HEADERS=xforwarded) doesn't reject requests
# with "HTTPS required"; fall back to $scheme for direct LAN clients.
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    https   https;
}
map $client_proto $client_port {
    default 80;
    https   443;
}

# The older gateway blocks below hard-code Connection "upgrade" because they
# only ever carry one kind of traffic. Theia mixes plain HTTP (assets, REST)
# and a long-lived WebSocket on the *same* location, so it needs the
# conditional form: echo "upgrade" only when the client actually asked for it,
# and "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost fzlbpms.local _;

    # fzlbpms.local terminates TLS on :443 (01-tls.conf) — Moodle's OAuth2
    # issuer validation is HTTPS-only, so a plain-http hit on that hostname
    # is always a mistake (stale bookmark, typed URL) rather than a LAN
    # client that's supposed to stay on http. localhost/LAN traffic is
    # untouched — nginx never terminates TLS for it (see absolute_redirect
    # comment in nginx-shared/app-server.conf).
    if ($host = fzlbpms.local) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/shared/app-server.conf;
}
