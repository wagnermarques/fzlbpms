# HTTPS entrypoint for local SSO testing (Moodle/Flowable's OAuth2 clients
# require HTTPS end-to-end, including server-to-server calls back to
# Keycloak — see bin/switch-domain.sh and ansible/setup-project.yml).
#
# fzlbpms.local resolves to this container from two places:
#   - your browser, via a /etc/hosts entry (127.0.0.1 fzlbpms.local),
#     provisioned by ansible/setup-project.yml
#   - other containers on fzl-network, via the network alias on the
#     fzl-nginx service in docker-compose.yml
#
# The certificate at /etc/nginx/certs/fzlbpms.local.pem is either:
#   - a real, browser-trusted cert issued by your local mkcert CA
#     (installed by ansible/setup-project.yml (--tags certs)), or
#   - the self-signed fallback baked in at image build time (Dockerfile),
#     if mkcert hasn't been set up yet — nginx always has something valid
#     to load either way, so this block never breaks `docker compose up`
#     for people who haven't run the mkcert setup.
server {
    listen 443 ssl;
    server_name fzlbpms.local;

    ssl_certificate     /etc/nginx/certs/fzlbpms.local.pem;
    ssl_certificate_key /etc/nginx/certs/fzlbpms.local-key.pem;

    include /etc/nginx/shared/app-server.conf;
}
