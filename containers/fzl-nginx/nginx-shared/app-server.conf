# Shared server body — included by both the plain-http (:80, 00-catchall.conf)
# and https (:443, 01-tls.conf) server blocks so the two never drift apart.
root /var/www/html;
index index.php index.html index.htm;

# Docker's embedded DNS; with proxy_pass in a variable, upstream names are
# resolved per-request, so nginx starts even when these containers are down.
resolver 127.0.0.11 valid=30s;

# nginx never terminates TLS itself for the LAN/localhost path (that happens
# upstream: LAN clients use plain http, tunnel clients terminate https at
# Cloudflare's edge; the fzlbpms.local path terminates TLS right here, see
# 01-tls.conf). With the default absolute_redirect on, any "return 301
# /path;" gets silently re-expanded to "$scheme://$host/path" using nginx's
# own $scheme — which is always http on the :80 block — downgrading https
# requests coming through a tunnel. Relative Location headers are valid HTTP
# and let the browser preserve whatever scheme/host it actually used.
absolute_redirect off;

# --- Reverse-proxy gateway routes (formerly on port 8899) ---

# ---------------------------------------------------------------------------
# Apache Karaf administration: Felix web console + Hawtio.
#
# Both are served at their NATIVE paths, deliberately. Every page, stylesheet
# and script the Felix console emits is an ABSOLUTE link to /system/console/...
# and Hawtio is a single-page app rooted at /hawtio, so proxying either under a
# stripped prefix returns a page whose links all point outside the proxy.
# Felix's manager.root setting does not move those links under Karaf's wrapper
# bundle, so the reverse proxy follows the tools rather than the other way
# round. /karafconsole is kept as a redirect so the documented URL still works.
#
# BOTH ARE GATED BY THE KEYCLOAK SIGN-IN (auth_request against oauth2-proxy,
# same gate as /theia/ and /orbeon/ — a logged-in session carrying the
# theia-user realm role). These grant full control of the OSGi runtime:
# install and stop bundles, edit configuration, read logs, and in Hawtio's
# case invoke JMX operations. They must never be anonymous, including through
# the public Cloudflare tunnel.
#
# Karaf's own HTTP Basic realm stays enabled behind that gate — see
# docker-entrypoint.d/11-karaf-basic-auth.sh for why, and for where the
# injected credential comes from. Users authenticate once, with Keycloak.
# ---------------------------------------------------------------------------
location /karafconsole {
    return 301 /system/console/bundles;
}

location /system/console {
    auth_request /oauth2/auth;
    error_page 401 = @karaf_signin;

    # ORDER MATTERS — "set" belongs to the rewrite module, so it must come
    # before any "rewrite ... break" in the same location; a "set" placed
    # after one never runs and proxy_pass gets an empty variable, answering
    # 500 ("using uninitialized "karaf_upstream" variable" / "invalid URL
    # prefix in """). That is what /karafconsole/ used to do.
    set $karaf_upstream http://fzl-karaf-camel-integration:8181;
    proxy_pass $karaf_upstream;

    include /etc/nginx/shared/karaf-auth.conf;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;

    # The console answers /system/console with a 302 to .../bundles, and Jetty
    # builds that Location from the proxied request — which reaches it over
    # plain HTTP, so it comes back as http://fzlbpms.local/... and downgrades
    # the browser off TLS. Rewrite it to a path-only Location, for the same
    # reason `absolute_redirect off` is set at the top of this file: the
    # browser then keeps whatever scheme and host it actually used.
    proxy_redirect ~^https?://[^/]+(/.*)$ $1;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}

location @karaf_signin {
    return 302 /oauth2/start?rd=$request_uri;
}

# Hawtio — Camel-oriented console (route diagrams, JMX, Jolokia) served from
# the same Karaf HTTP service on 8181.
location /hawtio {
    auth_request /oauth2/auth;
    error_page 401 = @hawtio_signin;

    set $hawtio_upstream http://fzl-karaf-camel-integration:8181;
    proxy_pass $hawtio_upstream;

    include /etc/nginx/shared/karaf-auth.conf;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;

    proxy_redirect ~^https?://[^/]+(/.*)$ $1;

    # Jolokia POSTs JMX requests and the UI polls them continuously; the
    # oauth2-proxy session cookie also rides along on every one of them.
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout      300s;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
}

location @hawtio_signin {
    return 302 /oauth2/start?rd=$request_uri;
}

# Redirect bare /flowable-ui to /flowable-ui/ so the prefix block below fires
location = /flowable-ui {
    return 301 /flowable-ui/;
}

# Flowable UI (/flowable-ui/... passed through unchanged — Spring Boot keeps its own context path)
location /flowable-ui/ {
    set $flowable_upstream http://fzl-flowable-ui:8080;
    proxy_pass $flowable_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $client_port;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
}

# Redirect bare /bpmndrawer to /bpmndrawer/ — bpmn-js's webpack "auto"
# publicPath resolves asset/font requests relative to the current request
# path (see the /theia comment below for the same issue), so the trailing
# slash matters here too.
location = /bpmndrawer {
    return 301 /bpmndrawer/;
}

# BPMN Drawer (bpmn-js modeler demo). No auth in front on purpose — it's a
# static, client-side diagram editor with no backend state or credentials
# to protect, unlike Theia below.
location /bpmndrawer/ {
    set $bpmndrawer_upstream http://fzl-bpmn-drawer:80;
    rewrite ^/bpmndrawer/(.*)$ /$1 break;
    proxy_pass $bpmndrawer_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
}

# fzlbpms Document Generation REST API (etec_coord_processo__aproveitamento_disciplina: port 9092)
location /fzlbpms/aproveitamento/ {
    set $aproveitamento_upstream http://fzl-karaf-camel-integration:9092;
    proxy_pass $aproveitamento_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
}

# BPMN diagram XML for fzlbpmsadmin's bpmn-js viewer (port 9091 — the
# Moodle/bpms Camel bundle; the generic /fzlbpms/ block below only reaches
# port 9090). Deliberately ungated: reaching this page already requires
# being logged into fzlbpmsadmin, and a process's BPMN structure isn't
# sensitive data. Kept separate from /bpms/ (which IS gated, via
# oauth2-proxy) because that gate uses a different login/cookie than
# fzlbpmsadmin-web's own Keycloak session — a user fully logged into
# fzlbpmsadmin may have no oauth2-proxy cookie at all.
location /fzlbpms/diagrams/ {
    set $diagrams_upstream http://fzl-karaf-camel-integration:9091;
    rewrite ^/fzlbpms/diagrams/(.*)$ /fzlbpms/bpms/process-diagram/$1 break;
    proxy_pass $diagrams_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
}

# fzlbpms Camel REST API (auth + admin user CRUD; /fzlbpms/... passed through unchanged)
location /fzlbpms/ {
    set $camel_upstream http://fzl-karaf-camel-integration:9090;
    proxy_pass $camel_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
}

# Keycloak (/auth/... is passed through unchanged)
location /auth/ {
    set $keycloak_upstream http://fzl-keycloak:8080;
    proxy_pass $keycloak_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $client_port;

    # Essential for Keycloak to work correctly behind a proxy
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
}

# --- Moodle Configuration (Requires /public) ---
# Bare /moodle (no trailing slash) would otherwise hit nginx's own
# automatic directory redirect, which builds an absolute URL from
# nginx's internal $scheme (always "http", since nginx never terminates
# TLS here) — that silently downgrades https requests coming through a
# tunnel. A relative redirect lets the browser keep its own scheme/host.
location = /moodle {
    return 301 /moodle/;
}

location /moodle {
    alias /var/www/html/moodle/public;
    try_files $uri $uri/ /moodle/r.php$is_args$args;
}

location ~ ^/moodle(.+\.php)(/.*)?$ {
    alias /var/www/html/moodle/public$1;
    fastcgi_split_path_info ^(/moodle.+\.php)(/.*)$;
    set $path_info $fastcgi_path_info;
    include fastcgi_params;
    set $php83_upstream fzl-php8.3-fpm:9000;
    fastcgi_pass $php83_upstream;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param PATH_INFO $path_info;
    # PHP apps (Moodle) need the real client-facing host/scheme to build
    # absolute URLs — fastcgi_params doesn't forward these by default.
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_read_timeout 300;
}

# --- fzlbpmsadmin-web (Angular SPA, static build) ---
# Bare /fzlbpmsadmin (no trailing slash) doesn't match the prefix
# location below, so it falls through to the generic "location /" PHP
# catch-all instead of the SPA — redirect it first.
location = /fzlbpmsadmin {
    return 301 /fzlbpmsadmin/;
}

location /fzlbpmsadmin/ {
    alias /var/www/fzlbpmsadmin/;
    try_files $uri $uri/ /fzlbpmsadmin/index.html;
}

# --- 1. Dedicated Block for the /ava211/ Application ---
# --- vai servir para varios instancias de moodles
location /ava211/ {
    # Define the root of the Moodle app within the main root
    # This is CRUCIAL: try_files must point to the subdirectory's index.php as fallback.
    try_files $uri $uri/ /ava211/index.php?$query_string;
}


# --- oauth2-proxy: the OIDC gate in front of /theia/ ---
# Keycloak's redirect lands on /oauth2/callback here; /oauth2/start begins
# the flow. These paths are passed through unchanged (no prefix strip).
location /oauth2/ {
    set $oauth2_upstream http://fzl-oauth2-proxy:4180;
    proxy_pass $oauth2_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # The session cookie carries the Keycloak id_token and refresh_token, so
    # /oauth2/callback answers with several large Set-Cookie headers that
    # overflow nginx's 4k default and turn the login into a 502. Same sizing
    # as the Keycloak block above, for the same reason.
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
}

# Subrequest target for auth_request below — never reachable directly.
location = /oauth2/auth {
    internal;
    set $oauth2_auth_upstream http://fzl-oauth2-proxy:4180;
    proxy_pass $oauth2_auth_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Uri   $request_uri;

    # A subrequest must not consume the original request's body.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # The large session cookie is sent up on every subrequest.
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
}

# --- Eclipse Theia browser IDE ---
# Bare /theia MUST redirect to /theia/. Theia's frontend derives both its
# asset paths (relative ./bundle.js, webpack publicPath 'auto') and its
# WebSocket URL from window.location.pathname — without the trailing slash
# those resolve against / and the IDE fails to boot. Relative redirect, to
# preserve the client's scheme (see absolute_redirect comment above).
location = /theia {
    return 301 /theia/;
}

location /theia/ {
    # A browser IDE is a remote shell on fzl-network. Authenticate first;
    # oauth2-proxy additionally requires the 'theia-user' realm role.
    auth_request /oauth2/auth;
    error_page 401 = @theia_signin;

    auth_request_set $theia_user $upstream_http_x_auth_request_user;
    proxy_set_header X-Forwarded-User $theia_user;

    # Theia's backend mounts its routes at root (servicesPath = '/services'),
    # so the prefix is stripped here.
    #
    # ORDER MATTERS: "set" belongs to the rewrite module, and "rewrite ...
    # break" halts that module for this location — so a "set" written after
    # the rewrite never runs, leaving proxy_pass with an empty variable and
    # a 500 ("invalid URL prefix in """). The /karafconsole/ block above got
    # this wrong for a while and answered 500 for exactly that reason.
    set $theia_upstream http://fzl-theia:3000;
    rewrite ^/theia/(.*)$ /$1 break;
    proxy_pass $theia_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $client_port;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The JSON-RPC socket and terminal streams are long-lived; buffering
    # them would stall the IDE and the default 60s read timeout would
    # tear the connection down every minute.
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @theia_signin {
    return 302 /oauth2/start?rd=$request_uri;
}

# --- Orbeon Forms (CE) — visual Form Builder + Form Runner ---
# Bare /orbeon -> /orbeon/ (Orbeon's context path). Relative redirect to
# preserve the client's scheme (see absolute_redirect note above).
location = /orbeon {
    return 301 /orbeon/;
}

# Orbeon serves on its own /orbeon context, so pass the path through unchanged
# (like /flowable-ui/). Gated by the shared oauth2-proxy sign-in (a logged-in
# Keycloak session with the theia-user role) so Form Builder isn't reachable
# anonymously — including via the public tunnel. TODO: give Orbeon its own
# Keycloak client + role (orbeon-admin) instead of reusing the theia gate;
# see containers/fzl-orbeon/README.
location /orbeon/ {
    auth_request /oauth2/auth;
    error_page 401 = @orbeon_signin;

    auth_request_set $orbeon_user $upstream_http_x_auth_request_user;
    proxy_set_header X-Forwarded-User $orbeon_user;

    set $orbeon_upstream http://fzl-orbeon:8080;
    proxy_pass $orbeon_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $client_port;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout      300s;
}

location @orbeon_signin {
    return 302 /oauth2/start?rd=$request_uri;
}

# --- bpms task inbox: the common landing point after login ---
# Same Keycloak/oauth2-proxy gate as /orbeon/, forwarding the logged-in
# username so the Camel route behind this can look up (and redirect to)
# whichever task is actually this user's — see bpms-my-tasks in
# moodle-admin-camel-context.xml.
location = /bpms {
    return 301 /bpms/;
}

location /bpms/ {
    auth_request /oauth2/auth;
    error_page 401 = @bpms_signin;

    # Deliberately Email, not User: oauth2-proxy's X-Auth-Request-User
    # carries the OIDC "sub" claim (an opaque Keycloak UUID), while
    # X-Auth-Request-Email carries the actual Keycloak user email — which is
    # what every Flowable task assignee (see bpms-start-create-moodle-user
    # in moodle-admin-camel-context.xml) is set to. Confirmed by logging the
    # raw header value; /theia/ and /orbeon/ use ...-User instead, but
    # nothing there compares it against anything, so it hasn't mattered yet.
    auth_request_set $bpms_user $upstream_http_x_auth_request_email;
    proxy_set_header X-Forwarded-User $bpms_user;

    set $bpms_upstream http://fzl-karaf-camel-integration:9091;
    rewrite ^/bpms/(.*)$ /fzlbpms/bpms/$1 break;
    proxy_pass $bpms_upstream;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
}

location @bpms_signin {
    return 302 /oauth2/start?rd=$request_uri;
}

# To other root-level apps or files, we need a generic root block too
location / {
    # This catches anything that didn't match any more specific dirs above like /ava211, and uses the default index.php
    try_files $uri $uri/ /index.php?$query_string;
}

# --- 3. Robust PHP-FPM Processing Block ---
# This regex is crucial for handling Moodle's path-info URLs (e.g., /ava211/lib/javascript.php/...)
location ~ [^/]\.php(/|$) {
    # Include standard parameters
    include fastcgi_params;

    # Split the path to isolate the script name from the path info (Moodle needs this)
    fastcgi_split_path_info ^(.+\.php)(/.+)$;

    # Define the SCRIPT_FILENAME and PATH_INFO for PHP
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;

    # Pass to the PHP-FPM container
    set $php83_upstream fzl-php8.3-fpm:9000;
    fastcgi_pass $php83_upstream;
    fastcgi_index index.php;

    # Standard settings
    fastcgi_param HTTP_PROXY ""; # Prevent proxying loops
    # PHP apps (Moodle) need the real client-facing host/scheme to build
    # absolute URLs — fastcgi_params doesn't forward these by default.
    fastcgi_param HTTP_HOST $http_host;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;
}


# Deny access to hidden files
location ~ /\.ht {
    deny all;
}
