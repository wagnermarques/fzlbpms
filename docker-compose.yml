# Host ports and credentials come from the .env file (single source of truth).
# Copy .env.template to .env before running docker compose.
# ${VAR:?} makes compose fail with a clear error if a variable is missing.
# Container-internal ports (right side of mappings, healthchecks, jdbc urls)
# stay hard-coded: they only exist inside the fzl-network.

services:

  fzl-nginx:
    build:
      # Root context so the Dockerfile can also pull in the
      # fzlbpmsadmin-web Angular sources for its static-SPA build stage.
      context: .
      dockerfile: containers/fzl-nginx/Dockerfile
    container_name: fzl-nginx
    restart: unless-stopped
    ports:
      - "${FZL_NGINX_PORT_HTTP:?}:80"
      - "${FZL_NGINX_PORT_HTTPS:?}:443"
    volumes:
      - ./src-projects/var_www/html:/var/www/html:rw #na conf do nginx: root /var/www/html;
      # Mounted outside /var/www (rather than nested under it, e.g.
      # /var/www/moodledata) because the btrfs storage driver has a known bug
      # where a bind mount nested inside a directory the image already
      # chown'd/touched at build time becomes invisible to readdir()/stat()
      # from the running container's own processes, even though it's listed
      # correctly in /proc/mounts. See containers/fzl-php8.3-fpm/docker-entrypoint.sh.
      - ./src-projects/moodledata:/moodledata:rw
      # Populated by ansible/setup-project.yml (--tags certs) —
      # see docker-entrypoint.d/10-install-mkcert-certs.sh for how a missing
      # or empty dir here is handled safely.
      - ./containers/fzl-nginx/certs:/run/mkcert-certs:ro
    environment:
      # Karaf's service credential, presented by nginx towards
      # /system/console and /hawtio once oauth2-proxy has established a
      # Keycloak session — see containers/fzl-nginx/docker-entrypoint.d/
      # 11-karaf-basic-auth.sh. Must match a user in the Karaf JAAS realm
      # (containers/fzl-karaf-camel-integration/custom_karaf_etc/
      # etc-from-4.4.7/users.properties). Values live in .env (gitignored).
      FZL_KARAF_USER: "${FZL_KARAF_USER:-}"
      FZL_KARAF_PASSWORD: "${FZL_KARAF_PASSWORD:-}"
    networks:
      fzl-network:
        # Lets other containers (Moodle, Flowable) reach this same nginx —
        # and therefore Keycloak — via https://fzlbpms.local, matching what
        # a browser resolves via the /etc/hosts entry on the dev machine.
        # See bin/switch-domain.sh and ansible/setup-project.yml.
        #
        # The current public domain is ALSO aliased here so internal
        # server-to-server calls that must match Moodle's $CFG->wwwroot
        # exactly (e.g. MOODLE_WS_URL) resolve straight to this container
        # instead of round-tripping out to the public internet/Cloudflare
        # tunnel and back — Moodle's initialise_fullme_variables()
        # (lib/setuplib.php) 303-redirects any request whose Host doesn't
        # match wwwroot, webservice calls included.
        aliases:
          - fzlbpms.local
          - ${FZL_PUBLIC_HOSTNAME:-fzlbpms.local}

  fzl-php8.1-fpm:
    build:
      context: ./containers/fzl-php8.1-fpm/
      dockerfile: Dockerfile
    container_name: fzl-php8.1-fpm
    restart: unless-stopped
    volumes:
      - ./src-projects/var_www/html:/var/www/html
    networks:
      - fzl-network

  fzl-php8.3-fpm:
    build:
      context: ./containers/fzl-php8.3-fpm/
      dockerfile: Dockerfile
    container_name: fzl-php8.3-fpm
    restart: unless-stopped
    volumes:
      - ./src-projects/var_www/html:/var/www/html
      - ./src-projects/moodledata:/moodledata
      # Trusted by docker-entrypoint.sh at container start if present —
      # populated by ansible/setup-project.yml (--tags certs). Needed for curl/Guzzle calls to
      # https://fzlbpms.local (Moodle's OAuth2 discovery/token exchange).
      - ./containers/fzl-php8.3-fpm/certs:/usr/local/share/ca-certificates/mkcert:ro
    networks:
      - fzl-network
    environment:
       - MOODLE_XMLRPC_ENABLED=0
       - MOODLE_MNET_DISPATCHER_MODE=off

  # One-shot, idempotent Moodle provisioner. Reuses the php-8.3 image (php +
  # curl + tar + pdo_pgsql), shares the web/data bind mounts and the network,
  # runs bin/moodle/install-moodle-in-container.sh, then exits. Safe to re-run:
  # it skips download/install when Moodle is already present.
  moodle-installer:
    build:
      context: ./containers/fzl-php8.3-fpm/
      dockerfile: Dockerfile
    container_name: fzl-moodle-installer
    depends_on:
      fzl-postgresql:
        condition: service_healthy
    volumes:
      - ./src-projects/var_www/html:/var/www/html
      - ./src-projects/moodledata:/moodledata
      - ./bin/moodle:/opt/moodle-scripts:ro
    environment:
      MOODLE_VERSION: ${MOODLE_VERSION:?}
      MOODLE_DB_HOST: fzl-postgresql
      FZL_POSTGRES_USER: ${FZL_POSTGRES_USER:?}
      FZL_POSTGRES_PASSWORD: ${FZL_POSTGRES_PASSWORD:?}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:?}
      MOODLE_DB_USER: ${MOODLE_DB_USER:?}
      MOODLE_DB_PASS: ${MOODLE_DB_PASS:?}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:?}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:?}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS:?}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:?}
      MOODLE_FULLNAME: ${MOODLE_FULLNAME:-fzlbpms Moodle}
      MOODLE_SHORTNAME: ${MOODLE_SHORTNAME:-fzlbpms}
      # Extra plugins bundled from a GitHub Releases page (one .zip per plugin).
      # The installer reads each zip's version.php to place it in the right
      # Moodle dir and registers it via install.php/upgrade.php. Set
      # MOODLE_PLUGINS_ENABLED=0 to skip; MOODLE_PLUGINS_RELEASE can pin a tag.
      MOODLE_PLUGINS_ENABLED: ${MOODLE_PLUGINS_ENABLED:-1}
      MOODLE_PLUGINS_REPO: ${MOODLE_PLUGINS_REPO:-wagnermarques/fzlbpms-moodle-plugins}
      MOODLE_PLUGINS_RELEASE: ${MOODLE_PLUGINS_RELEASE:-latest}
    networks:
      - fzl-network
    restart: "no"
    entrypoint: ["bash", "/opt/moodle-scripts/install-moodle-in-container.sh"]

  # One-shot, idempotent provisioner for Moodle's OAuth2 issuer (SSO against
  # Keycloak). Runs after both Moodle itself and Camel's Keycloak client
  # bootstrap (which creates the 'moodle' client) are up; the entrypoint
  # retries because Camel's own bootstrap has an internal startup delay.
  moodle-oauth2-configurator:
    build:
      context: ./containers/fzl-php8.3-fpm/
      dockerfile: Dockerfile
    container_name: fzl-moodle-oauth2-configurator
    depends_on:
      - moodle-installer
      - fzl-karaf-camel-integration
    volumes:
      - ./src-projects/var_www/html:/var/www/html
      - ./src-projects/moodledata:/moodledata
      - ./bin/moodle:/opt/moodle-scripts:ro
      - ./containers/fzl-php8.3-fpm/certs:/usr/local/share/ca-certificates/mkcert:ro
    environment:
      KEYCLOAK_ISSUER_BASEURL: ${FZL_PUBLIC_PROTO:-https}://${FZL_PUBLIC_HOSTNAME:-localhost}/auth/realms/fzlbpms
      KEYCLOAK_MOODLE_CLIENT_ID: ${FZL_MOODLE_CLIENT_ID:?}
      KEYCLOAK_MOODLE_CLIENT_SECRET: ${FZL_MOODLE_CLIENT_SECRET:?}
      # SSO user to promote to Moodle site administrator (see
      # configure-oauth2-keycloak.php — requires that user's first Keycloak
      # login to have happened, and is a no-op until then). This is Moodle's
      # own dedicated admin identity, distinct from FZLBPMS_ADMIN_USERNAME
      # (the stack-wide super-admin) and from MOODLE_ADMIN_USER (Moodle's
      # local, non-SSO admin account).
      MOODLE_SITEADMIN_USERNAME: ${FZL_MOODLE_ADMIN_USERNAME:?}
    networks:
      - fzl-network
    restart: "no"
    entrypoint: ["bash", "/opt/moodle-scripts/configure-oauth2-keycloak-entrypoint.sh"]

  # One-shot, idempotent provisioner that enables Moodle's REST web services
  # and binds the shared MOODLE_WS_TOKEN to a dedicated fzlbpms_ws service
  # account, so the Camel moodle bundle can create categories/courses. Runs
  # after Moodle is installed. Safe to re-run.
  moodle-webservice-configurator:
    build:
      context: ./containers/fzl-php8.3-fpm/
      dockerfile: Dockerfile
    container_name: fzl-moodle-webservice-configurator
    depends_on:
      - moodle-installer
    volumes:
      - ./src-projects/var_www/html:/var/www/html
      - ./src-projects/moodledata:/moodledata
      - ./bin/moodle:/opt/moodle-scripts:ro
    environment:
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:?}
    networks:
      - fzl-network
    restart: "no"
    entrypoint: ["bash", "/opt/moodle-scripts/configure-moodle-webservice-entrypoint.sh"]

  fzl-mysql:
    image: mysql:8.4.6
    container_name: fzl-mysql
    restart: unless-stopped
    ports:
      - "${FZL_MYSQL_PORT:?}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${FZL_MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${FZL_MYSQL_DATABASE:?}
      MYSQL_USER: ${FZL_MYSQL_USER:?}
      MYSQL_PASSWORD: ${FZL_MYSQL_PASSWORD:?}
    volumes:
      - ./src-projects:/sql-scripts
      - ./containers/fzl-mysql/mysql-data:/var/lib/mysql

    networks:
      - fzl-network

  fzl-postgresql:
    build:
      context: ./containers/fzl-postgresql
    container_name: fzl-postgresql
    restart: always
    ports:
      - "${FZL_POSTGRES_PORT:?}:5432"
    environment:
      POSTGRES_USER: ${FZL_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${FZL_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${FZL_POSTGRES_DB:?}
      POSTGRES_INITDB_ARGS: "--locale=pt_BR.UTF-8" # Para garantir o locale na criacao do DB
    volumes:
      - ./src-projects:/sql-scripts
      - ./containers/fzl-postgresql/init-scripts:/docker-entrypoint-initdb.d
      - fzl_postgresql_data:/var/lib/postgresql/data
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  fzl-karaf-camel-integration:
    build:
      context: ./containers/fzl-karaf-camel-integration
      dockerfile: Dockerfile
    container_name: fzl-karaf-camel-integration
    ports:
      - "${FZL_KARAF_REST_PORT:?}:9090"
      - "${FZL_KARAF_MOODLE_REST_PORT:-9091}:9091"
    environment:
      # Karaf's own JAAS realm — entrypoint.sh writes etc/users.properties from
      # these at container start, so the credential never lives in git. nginx
      # reads the SAME two variables to build the Authorization header it
      # presents towards /system/console and /hawtio, so they cannot drift.
      # ":?" on purpose: fail fast rather than boot with a default password.
      FZL_KARAF_USER: "${FZL_KARAF_USER:?}"
      FZL_KARAF_PASSWORD: "${FZL_KARAF_PASSWORD:?}"
      KC_HOST: fzl-keycloak
      KC_HTTP_RELATIVE_PATH: /auth
      KC_ADMIN_USER: ${FZL_KEYCLOAK_ADMIN_USER:?}
      KC_ADMIN_PASSWORD: ${FZL_KEYCLOAK_ADMIN_PASSWORD:?}
      KC_CAMEL_CLIENT_SECRET: ${FZL_CAMEL_CLIENT_SECRET:?}
      FZL_REALM: fzlbpms
      FZLBPMS_ADMIN_USERNAME: ${FZLBPMS_ADMIN_USERNAME:?}
      FZLBPMS_ADMIN_PASSWORD: ${FZLBPMS_ADMIN_PASSWORD:?}
      # Per-software administrator identities — see .env.template. Bootstrapped
      # by keycloak-admin-camel-context.xml alongside FZLBPMS_ADMIN_USERNAME.
      FZL_FLOWABLE_ADMIN_USERNAME: ${FZL_FLOWABLE_ADMIN_USERNAME:?}
      FZL_FLOWABLE_ADMIN_PASSWORD: ${FZL_FLOWABLE_ADMIN_PASSWORD:?}
      FZL_MOODLE_ADMIN_USERNAME: ${FZL_MOODLE_ADMIN_USERNAME:?}
      FZL_MOODLE_ADMIN_PASSWORD: ${FZL_MOODLE_ADMIN_PASSWORD:?}
      # SSO clients (browser-redirect OIDC) bootstrapped alongside fzlbpms-camel.
      FZL_PUBLIC_HOSTNAME: ${FZL_PUBLIC_HOSTNAME:-localhost}
      FZL_WEBAPP_CLIENT_ID: ${FZL_WEBAPP_CLIENT_ID:?}
      FZL_MOODLE_CLIENT_ID: ${FZL_MOODLE_CLIENT_ID:?}
      FZL_MOODLE_CLIENT_SECRET: ${FZL_MOODLE_CLIENT_SECRET:?}
      FZL_FLOWABLE_CLIENT_ID: ${FZL_FLOWABLE_CLIENT_ID:?}
      FZL_FLOWABLE_CLIENT_SECRET: ${FZL_FLOWABLE_CLIENT_SECRET:?}
      FZL_THEIA_CLIENT_ID: ${FZL_THEIA_CLIENT_ID:?}
      FZL_THEIA_CLIENT_SECRET: ${FZL_THEIA_CLIENT_SECRET:?}
      # Microsoft (Azure/Entra ID) identity provider — opt-in, empty by
      # default. Only FZL_MICROSOFT_CLIENT_ID gates whether kc-setup creates
      # it; must always be *set* (even empty) so the Camel property
      # placeholder resolves without needing the var present in the shell env.
      FZL_MICROSOFT_CLIENT_ID: ${FZL_MICROSOFT_CLIENT_ID:-}
      FZL_MICROSOFT_CLIENT_SECRET: ${FZL_MICROSOFT_CLIENT_SECRET:-}
      FZL_MICROSOFT_TENANT_ID: ${FZL_MICROSOFT_TENANT_ID:-}
      # Moodle REST web service (consumed by moodle-admin-camel-context.xml).
      # Uses the canonical https host so Moodle sees its own wwwroot; the JVM
      # trusts the mkcert CA via the certs mount below + entrypoint import.
      MOODLE_WS_URL: ${MOODLE_WS_URL:-https://fzlbpms.local/moodle/webservice/rest/server.php}
      MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:?}
      # CSV the moodle bundle reads for the "disciplinas" endpoint (path is
      # inside the container; karaf_input_dir is mounted at /opt/karaf/input_data).
      MOODLE_DISCIPLINAS_CSV: ${MOODLE_DISCIPLINAS_CSV:-/opt/karaf/input_data/disciplinas_modulos_desenvolvimento_sistemas.csv}
    volumes:
      - ./src-projects/karaf_bundles:/opt/karaf/deploy_bundles
      - ./src-projects/karaf_deploy_dir:/opt/karaf/deploy
      # mkcert CA so the JVM trusts https://fzlbpms.local (see entrypoint.sh).
      - ./containers/fzl-karaf-camel-integration/certs:/run/mkcert-certs:ro
      - ./src-projects/karaf_input_dir:/opt/karaf/input_data
      - ./src-projects/karaf_output_dir:/opt/karaf/output_data
      - ./src-projects/karaf_project_sources_dir:/opt/karaf/sources:rw
      - ./containers/fzl-karaf-camel-integration/karaf-data:/opt/karaf/data
    networks:
      - fzl-network
    restart: unless-stopped
    depends_on:
      - fzl-keycloak

  fzl-angular-dev:
    image: fzl-angular-dev:0.0.1
    # Built locally, never published — see the note on fzl-theia.
    pull_policy: build
    build:
      context: ./containers/fzl-angular-dev
      dockerfile: Dockerfile
      target: development
    container_name: fzl-angular-dev
    ports:
      - "${FZL_ANGULAR_DEV_PORT:?}:4200"
    volumes:
      - ./containers/fzl-angular-dev/src-projects/:/app
    networks:
      - fzl-network

  fzl-nexus:
    build:
      context: ./containers/fzl-nexus
    container_name: fzl-nexus
    restart: always
    ports:
      - "${FZL_NEXUS_PORT_HTTP:?}:8081"
      - "${FZL_NEXUS_PORT_DOCKER:?}:8082"
    volumes:
      - ./containers/fzl-nexus/nexus-data:/nexus-data
    environment:
      MAX_HEAP_SIZE: "2048m"
      MIN_HEAP_SIZE: "2048m"
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  fzl-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fzl-phpmyadmin
    ports:
      - '${FZL_PHPMYADMIN_PORT:?}:80'
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=fzl-mysql
    depends_on:
      - fzl-mysql
    networks:
      - fzl-network

  fzl-elasticsearch:
    build:
      context: ./containers/fzl-elasticsearch
      dockerfile: Dockerfile-Elasticsearch
    container_name: fzl-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
    ports:
      - "${FZL_ELASTICSEARCH_PORT:?}:9200"
    volumes:
      - ./containers/fzl-elasticsearch/es-data:/usr/share/elasticsearch/data
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  fzl-kibana:
    build:
      context: ./containers/fzl-elasticsearch
      dockerfile: Dockerfile-Kibana
    container_name: fzl-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://fzl-elasticsearch:9200
      - SERVER_HOST=0.0.0.0
    ports:
      - "${FZL_KIBANA_PORT:?}:5601"
    depends_on:
      - fzl-elasticsearch
    networks:
      - fzl-network

  fzl-mongodb:
    image: mongo:4.4
    container_name: fzl-mongodb
    restart: unless-stopped
    volumes:
      - ./containers/fzl-mongodb/mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${FZL_MONGO_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${FZL_MONGO_PASSWORD:?}
      MONGO_INITDB_DATABASE: ${FZL_MONGO_DATABASE:?}
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fzl-redis:
    image: redis:7-alpine
    container_name: fzl-redis
    restart: unless-stopped
    volumes:
      - ./containers/fzl-redis/redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fzl-fakemail:
    container_name: fzl-fakemail
    image: gessnerfl/fake-smtp-server:latest
    restart: always
    environment:
      - MH_UI_AUTH_FILE=/maildata/auth.txt
      # host network: web UI must not use its 8080 default (fzl-flowable-ui owns it)
      - SERVER_PORT=${FZL_FAKEMAIL_WEB_PORT:?}
      - MANAGEMENT_SERVER_PORT=${FZL_FAKEMAIL_MGMT_PORT:?}
      - FAKESMTP_PORT=${FZL_FAKEMAIL_SMTP_PORT:?}
    network_mode: host

  fzl-portainer:
    image: portainer/portainer-ce:latest
    container_name: fzl-portainer
    restart: always
    ports:
      - "${FZL_PORTAINER_PORT_HTTP:?}:9000"
      - "${FZL_PORTAINER_PORT_TLS:?}:9043"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./containers/fzl-portainer/portainer-data:/data

  fzl-keycloak-db:
    image: postgres:16-alpine
    container_name: fzl-keycloak-db
    restart: always
    environment:
      POSTGRES_DB: ${FZL_KEYCLOAK_DB_NAME:?}
      POSTGRES_USER: ${FZL_KEYCLOAK_DB_USER:?}
      POSTGRES_PASSWORD: ${FZL_KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - ./containers/fzl-keycloak/postgres-data:/var/lib/postgresql/data
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  fzl-keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: fzl-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://fzl-keycloak-db:5432/${FZL_KEYCLOAK_DB_NAME:?}
      KC_DB_USERNAME: ${FZL_KEYCLOAK_DB_USER:?}
      KC_DB_PASSWORD: ${FZL_KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${FZL_KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FZL_KEYCLOAK_ADMIN_PASSWORD:?}
      # Fixed (not per-request-dynamic) so every URL Keycloak generates —
      # login page, discovery document, token/authorization endpoints — is
      # consistent regardless of whether the request arrived from a browser
      # via nginx or from a container calling Keycloak directly. Required
      # for the fzlbpmsadmin-web/Moodle browser-redirect OIDC flow to work;
      # a single fixed hostname can't simultaneously be "correct" for LAN
      # and the public tunnel, so this picks the public one as canonical.
      KC_HOSTNAME: ${FZL_PUBLIC_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "${FZL_KEYCLOAK_PORT:?}:8080"
    depends_on:
      fzl-keycloak-db:
        condition: service_healthy
    networks:
      - fzl-network

  fzl-bpmn-drawer:
    build:
      context: ./containers/fzl-bpmn-drawer
      dockerfile: Dockerfile
    container_name: fzl-bpmn-drawer
    ports:
      - "${FZL_BPMN_DRAWER_PORT:?}:80"
    networks:
      - fzl-network

  # PostgreSQL database for Flowable UI persistence
  fzl-flowable-db:
    image: postgres:15-alpine
    container_name: fzl-flowable-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FZL_FLOWABLE_DB_NAME:?}
      POSTGRES_USER: ${FZL_FLOWABLE_DB_USER:?}
      POSTGRES_PASSWORD: ${FZL_FLOWABLE_DB_PASSWORD:?}
    ports:
      - "${FZL_FLOWABLE_DB_PORT:?}:5432" # Mapped to 5435 to avoid conflict with fzl-postgresql on 5432
    volumes:
      - flowable_db_data:/var/lib/postgresql/data
    networks:
      - fzl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flowable UI: Includes Modeler, Task, Admin, IDM apps in a single container
  # Fixada na versao to 6.7.2, nao usar a versao 6.8.0
  # A DefaultAsyncTaskExecutor não estarta corretamente e lanca uma NullPointerException ao chegar em qualquer task
  fzl-flowable-ui:
    image: flowable/flowable-ui:6.7.2
    container_name: fzl-flowable-ui
    restart: unless-stopped
    depends_on:
      fzl-flowable-db:
        condition: service_healthy
    ports:
      - "${FZL_FLOWABLE_UI_PORT:?}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://fzl-flowable-db:5432/${FZL_FLOWABLE_DB_NAME:?}
      - SPRING_DATASOURCE_USERNAME=${FZL_FLOWABLE_DB_USER:?}
      - SPRING_DATASOURCE_PASSWORD=${FZL_FLOWABLE_DB_PASSWORD:?}
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=org.postgresql.Driver
      # Configure flowable UI memory limit if needed
      - JAVA_OPTS=-Xms512m -Xmx1024m
      # --- Keycloak SSO (OIDC login instead of Flowable's own IDM form) ---
      # Honor X-Forwarded-Proto/Host from nginx so the OAuth2 redirect_uri
      # is built with the public https origin, not the container's http one.
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      - FLOWABLE_COMMON_APP_SECURITY_TYPE=oauth2
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=${FZL_FLOWABLE_CLIENT_ID:?}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${FZL_FLOWABLE_CLIENT_SECRET:?}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_NAME=Keycloak
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE=authorization_code
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE=openid,profile,email
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=${FZL_PUBLIC_PROTO:-https}://${FZL_PUBLIC_HOSTNAME:-localhost}/auth/realms/fzlbpms
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE=preferred_username
      # Baseline for every realm user: Task app access only. Admin authorities
      # (access-idm/access-admin/access-modeler/access-rest-api) come ONLY from
      # the 'flowable_authorities' claim, which Keycloak populates from the
      # user's client roles on the 'flowable' client — granted solely to
      # FZL_FLOWABLE_ADMIN_USERNAME by keycloak-admin-camel-context.xml. So the
      # flowable-admin user (and only that user) is a real Flowable admin.
      # NOTE: these flowable.common.app.security.oauth2.* properties CANNOT be
      # set as individual env vars — the Java field is `oAuth2` (canonical
      # name "o-auth2") and dashed leaves like default-authorities don't
      # survive env-var relaxed binding. SPRING_APPLICATION_JSON binds the
      # exact property names, matching flowable-default.properties.
      - >-
        SPRING_APPLICATION_JSON={
        "flowable.common.app.security.oauth2.default-authorities":"access-task",
        "flowable.common.app.security.oauth2.authorities-attribute":"flowable_authorities",
        "flowable.common.app.security.oauth2.default-groups":"flowableUser",
        "flowable.common.app.security.oauth2.full-name-attribute":"name",
        "flowable.common.app.security.oauth2.first-name-attribute":"given_name",
        "flowable.common.app.security.oauth2.last-name-attribute":"family_name",
        "flowable.common.app.security.oauth2.email-attribute":"email"}
    volumes:
      # Populated by ansible/setup-project.yml (--tags certs).
      # The 'flowable' user can't write the JVM's own cacerts (root-owned),
      # so the entrypoint below builds a writable copy instead — see there
      # for why. Needed for this container's own OIDC discovery/token-
      # exchange calls to https://fzlbpms.local (Keycloak).
      - ./containers/fzl-flowable-ui/certs:/run/mkcert-certs:ro
      # CSVs the moodle-provision-courses process reads (Groovy script task).
      - ./workspaces/fzlcoord/csvs-2026Sem2:/opt/fzlbpms/csvs:ro
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /run/mkcert-certs/mkcert-ca.pem ]; then
          TRUSTSTORE=/tmp/cacerts-with-mkcert
          cp "$$JAVA_HOME/lib/security/cacerts" "$$TRUSTSTORE"
          if "$$JAVA_HOME/bin/keytool" -importcert -noprompt -trustcacerts \
              -alias mkcert-local-ca \
              -file /run/mkcert-certs/mkcert-ca.pem \
              -keystore "$$TRUSTSTORE" -storepass changeit; then
            export JAVA_OPTS="$${JAVA_OPTS:-} -Djavax.net.ssl.trustStore=$$TRUSTSTORE -Djavax.net.ssl.trustStorePassword=changeit"
            echo "[entrypoint] Trusted the local mkcert CA for https://fzlbpms.local."
          else
            echo "[entrypoint] WARNING - failed to import the mkcert CA; https://fzlbpms.local calls will fail TLS verification."
          fi
        else
          echo "[entrypoint] No mkcert CA at /run/mkcert-certs - https://fzlbpms.local calls will fail TLS verification. Run: ansible-playbook -i ansible/inventory.ini ansible/setup-project.yml --tags certs -K"
        fi
        exec /flowable-entrypoint.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fzl-network

  # GitLab Community Edition for local issue tracking, git repos, tags, merge requests
  gitlab:
    image: gitlab/gitlab-ce:16.11.2-ce.0
    container_name: gitlab-ce
    ports:
      - "${FZL_GITLAB_PORT_HTTP:?}:80" # (avoiding internal port 8082 conflict with Puma, and host port 8082 conflict with fzl-nexus)
      - "${FZL_GITLAB_PORT_SSH:?}:22"   # SSH port
    environment:
      GITLAB_ROOT_PASSWORD: "${FZL_GITLAB_ROOT_PASSWORD:?}"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${FZL_GITLAB_PORT_HTTP}'
        nginx['listen_port'] = 80
        gitlab_rails['gitlab_shell_ssh_port'] = ${FZL_GITLAB_PORT_SSH}
        # Reduce memory consumption for local environment
        postgresql['shared_buffers'] = "256MB"
        sidekiq['concurrency'] = 8
        prometheus_monitoring['enable'] = false
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fzl-network

  # Eclipse Theia browser IDE, served by fzl-nginx at /theia/ (see
  # nginx-shared/app-server.conf). Theia derives its own asset and WebSocket
  # URLs from window.location.pathname, so the sub-path works without any
  # build-time base-path flag — but nginx must strip the /theia prefix
  # (the backend mounts its routes at root) and must redirect /theia to
  # /theia/, since a missing trailing slash breaks relative asset resolution.
  #
  # Single shared instance: one workspace on disk, shared by everyone who
  # logs in. Access is gated by fzl-oauth2-proxy below — a browser IDE is a
  # remote shell on fzl-network, so it is deliberately NOT open to the realm
  # at large, only to holders of the 'theia-user' role.
  #
  # Custom-plugin workflow: write a VS Code plugin under
  # src-projects/fzl-theia-plugins/<name> (visible inside the IDE itself, see
  # the volume below), run bin/theia/build-plugins.sh to package it and unpack
  # it into src-projects/fzl-theia-plugins-dist/<name>/, then
  # `docker compose restart fzl-theia` to load it — no image rebuild needed.
  # Note it must be a VS Code plugin, not a Theia extension: only the former
  # can be deployed into a running application.
  fzl-theia:
    build:
      context: ./containers/fzl-theia
      dockerfile: Dockerfile
      args:
        # Must match the host user owning ./workspaces, or the IDE cannot
        # write to it. Override in .env if your host user isn't 1000:1000.
        THEIA_UID: ${FZL_THEIA_UID:-1000}
        THEIA_GID: ${FZL_THEIA_GID:-1000}
    image: fzl-theia:0.0.1
    # Built locally, never published: without this compose tries to pull first
    # and prints an alarming "pull access denied" on every fresh clone.
    pull_policy: build
    container_name: fzl-theia
    ports:
      # Direct access, bypassing nginx and therefore bypassing SSO — useful
      # for debugging, but do not expose this port beyond the dev machine.
      - "${FZL_THEIA_PORT:-3000}:3000"
    volumes:
      # Scoped to ./workspaces on purpose: the repo root holds .env and its
      # secrets, and everyone with IDE access would be able to read it.
      - ./workspaces:/home/workspace:rw
      # Plugin sources you're actively writing, mounted as a subpath of the
      # workspace bind mount above (Docker mounts nest correctly) so they
      # show up directly in Theia's own file explorer for editing.
      - ./src-projects/fzl-theia-plugins:/home/workspace/fzl-theia-plugins:rw
      # Unpacked plugin output (see bin/theia/build-plugins.sh) — this is the
      # second THEIA_DEFAULT_PLUGINS local-dir source (see Dockerfile). One
      # directory per plugin: Theia does not unpack .vsix files from a system
      # plugin source, only from a user install.
      # Restart the container to pick up anything new here; no rebuild needed.
      - ./src-projects/fzl-theia-plugins-dist:/home/custom-plugins:rw
      - theia_user_data:/home/theia/.theia
      # The container runs as non-root, so it can't run update-ca-certificates
      # at start. Instead the CA is handed to Node directly via
      # NODE_EXTRA_CA_CERTS (see the Dockerfile), which *appends* to the
      # built-in bundle rather than replacing it — so Theia can reach both
      # https://fzlbpms.local and the public Open VSX registry.
      - ./containers/fzl-theia/certs/mkcert-ca.crt:/etc/fzlbpms/mkcert-ca.crt:ro
    networks:
      - fzl-network
    restart: unless-stopped

  # OIDC gate in front of /theia/. nginx calls this via auth_request; this
  # container never proxies the IDE itself (--upstream=static://202), it only
  # answers "is this browser session allowed?".
  fzl-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: fzl-oauth2-proxy
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${FZL_PUBLIC_PROTO:-https}://${FZL_PUBLIC_HOSTNAME:-localhost}/auth/realms/fzlbpms
      - --client-id=${FZL_THEIA_CLIENT_ID:?}
      - --client-secret=${FZL_THEIA_CLIENT_SECRET:?}
      - --cookie-secret=${FZL_OAUTH2_COOKIE_SECRET:?}
      - --redirect-url=${FZL_PUBLIC_PROTO:-https}://${FZL_PUBLIC_HOSTNAME:-localhost}/oauth2/callback
      # Authentication answers "who", not "should this person get a shell".
      # Gate on an explicit role rather than realm membership.
      - --allowed-role=theia-user
      - --email-domain=*
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --cookie-secure=${FZL_OAUTH2_COOKIE_SECURE:-true}
      - --code-challenge-method=S256
      # Only fzl-nginx should be believed about X-Forwarded-*. Without this,
      # oauth2-proxy trusts those headers from any source (0.0.0.0/0), so any
      # container on fzl-network could spoof the client IP.
      - --trusted-proxy-ip=172.18.0.0/16
    volumes:
      # OIDC discovery runs against https://fzlbpms.local/auth/... — without
      # the mkcert CA that call fails TLS verification and the proxy never
      # becomes ready. Populated by ansible/setup-project.yml (--tags certs).
      #
      # Mounted as a FILE inside /etc/ssl/certs, not as a directory: this is a
      # distroless Go binary, and Go's root-CA loader scans /etc/ssl/certs for
      # regular files, skipping subdirectories. A directory mount here silently
      # trusts nothing and the proxy crash-loops on "certificate signed by
      # unknown authority".
      - ./containers/fzl-oauth2-proxy/certs/mkcert-ca.crt:/etc/ssl/certs/mkcert-ca.crt:ro
    networks:
      - fzl-network
    depends_on:
      - fzl-keycloak
    restart: unless-stopped

  fzl-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fzl-cloudflared
    restart: unless-stopped
    # This tunnel is "locally-managed" (created via the cloudflared CLI, not
    # the dashboard's token flow) — Cloudflare fixes that type at creation
    # time, so its Zero Trust dashboard "Routes" tab is permanently read-only
    # regardless of how the connector is run. Routing (fzlbpms.com.br ->
    # http://fzl-nginx:80) must come from a local ingress config instead; see
    # containers/fzl-cloudflared/config.yml. Still authenticates via token —
    # no credentials-file/tunnel UUID needed for that part.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${FZL_CLOUDFLARE_TUNNEL_TOKEN:?}
    volumes:
      - ./containers/fzl-cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    # Lets the ssh.fzlbpms.com.br ingress rule (config.yml) reach the HOST's
    # own sshd — Docker for Linux doesn't resolve host.docker.internal by
    # default the way Docker Desktop does.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fzl-network

  # Orbeon Forms Community Edition (LGPL) — open-source forms platform (visual
  # Form Builder + Form Runner). Built locally from the CE WAR (Orbeon images
  # only its commercial PE). Reached at https://fzlbpms.local/orbeon/. Form
  # definitions and data persist in fzl-postgresql (database 'orbeon', created
  # and migrated by the container entrypoint). See containers/fzl-orbeon/README.
  fzl-orbeon:
    build:
      context: ./containers/fzl-orbeon
    image: fzl-orbeon:0.0.1
    # Built locally, never published — go straight to building (see fzl-theia).
    pull_policy: build
    container_name: fzl-orbeon
    ports:
      # Direct access (dev), bypassing nginx + SSO. Reach it normally at
      # https://fzlbpms.local/orbeon/. Do not expose this port off the machine.
      - "${FZL_ORBEON_PORT:-8890}:8080"
    environment:
      FZL_POSTGRES_USER: ${FZL_POSTGRES_USER:?}
      FZL_POSTGRES_PASSWORD: ${FZL_POSTGRES_PASSWORD:?}
      FZL_ORBEON_DB_NAME: ${FZL_ORBEON_DB_NAME:-orbeon}
      FZL_ORBEON_CRYPTO_PASSWORD: ${FZL_ORBEON_CRYPTO_PASSWORD:?}
    depends_on:
      fzl-postgresql:
        condition: service_healthy
    networks:
      - fzl-network
    restart: unless-stopped

networks:
  fzl-network:
    driver: bridge

volumes:
  fzl_postgresql_data:
  flowable_db_data:
  # Theia's per-user settings, keybindings and plugin state. Kept off the
  # ./workspaces bind mount so IDE config doesn't land in the users' files.
  theia_user_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:

