<app-fixed-head [drawer]="drawer" [userName]="currentUser()" (login)="login()" (logout)="logout()" />

<mat-drawer-container class="drawer-container">
  <mat-drawer #drawer [mode]="isSmallScreen ? 'over' : 'side'" [opened]="!isSmallScreen" class="sidenav">
    <div class="drawer-header">
      <h2>Menu</h2>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" (click)="drawer.close()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>

      <a mat-list-item routerLink="/appshomeview" (click)="drawer.close()">
        <mat-icon matListItemIcon>apps</mat-icon>
        <span matListItemTitle>Aplicações</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    <div class="content-wrapper">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>

<app-fixed-statusbar />
