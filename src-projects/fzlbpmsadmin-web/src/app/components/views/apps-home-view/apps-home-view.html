<h2>Applications & Projects</h2>

<mat-tab-group animationDuration="0ms">
  @for (app of applications(); track app.name) {
    <mat-tab [label]="app.name">
      <div class="tab-content">
        <mat-card class="app-card">
          <mat-card-header>
            <mat-card-title>{{ app.name }}</mat-card-title>
            <mat-card-subtitle>System Application</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <p *ngIf="app.description">{{ app.description }}</p>
            <div class="url-section">
              <strong>URL:</strong>
              <a class="link" [href]="app.url" target="_blank" rel="noopener">{{ app.url }}</a>
            </div>

            <div *ngIf="app.credentials" class="credentials-section">
              <mat-icon inline>lock</mat-icon>
              <strong>Default Credentials:</strong>
              <ul>
                <li>User: <code>{{ app.credentials.user }}</code></li>
                <li>Password: <code>{{ app.credentials.pass }}</code></li>
              </ul>
            </div>
          </mat-card-content>
          <mat-card-actions>
            <a mat-flat-button color="primary" [href]="app.url" target="_blank" rel="noopener">
              <mat-icon>open_in_new</mat-icon> Open in Browser
            </a>
          </mat-card-actions>
        </mat-card>
      </div>
    </mat-tab>
  }
</mat-tab-group>
